jobs:
  fmt-check:
    name: fmt & check
    runs-on: ubuntu-latest
    steps:
      - name: Set Rust toolchain to 1.90
        run: rustup override set 1.90
      - name: Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - uses: actions/checkout@v5
      - name: Cargo fmt
        # We don't really care about fmt failures.
        run: cargo fmt --check || true
      - name: Cargo check
        run: cargo check

on:
  push: